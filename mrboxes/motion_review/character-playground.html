<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot — movement playground</title><style>
*{box-sizing:border-box}body{margin:0;background:#131d26;color:#e8f0f4;font:16px system-ui}canvas{display:block;touch-action:none;outline:none}header{position:absolute;top:26px;left:30px;pointer-events:none}small{color:#88c8e6;font-size:12px;letter-spacing:.16em}h1{font-size:25px;font-weight:600;margin:6px 0}#status{color:#b5c9d5;font-size:15px}footer{position:absolute;bottom:24px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 20px;background:#101b25e8;border:1px solid #3d5363;border-radius:10px}.keys{line-height:1.9}kbd{border:1px solid #648299;border-radius:4px;padding:3px 8px;margin-right:4px;color:white}span{color:#b0c3d0}button{font:inherit;color:#eef6ff;background:#29485e;border:1px solid #65849c;border-radius:6px;padding:10px 16px;cursor:pointer}button:focus-visible{outline:2px solid #9ce0ff}#error{color:#ffc5a6} @media(max-width:750px){footer{font-size:13px;left:12px;right:12px;padding:10px;gap:8px}header{left:20px}h1{font-size:21px}}
</style></head><body><header><small>ROBOT MOTION STUDY</small><h1>Movement playground</h1><p id="status" role="status">Loading robot…</p><p id="error" role="alert"></p></header><footer><div class="keys"><kbd>W</kbd> Walk forward &nbsp; <kbd>A</kbd> Turn left &nbsp; <kbd>D</kbd> Turn right<br><span>W + A / D: walk while turning · Drag left: clockwise orbit · Drag right: anticlockwise · Fixed camera distance</span></div><button id="reset">Reset position</button></footer><script type="module" src="./character-playground.js"></script></body></html>
