<script>
function ytVideoId(url){
  if(!url)return'';
  var s=url.trim();var m;
  m=s.match(/[?&]v=([A-Za-z0-9_-]{6,})/);if(m)return m[1];
  m=s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/);if(m)return m[1];
  m=s.match(/embed\/([A-Za-z0-9_-]{6,})/);if(m)return m[1];
  m=s.match(/shorts\/([A-Za-z0-9_-]{6,})/);if(m)return m[1];
  m=s.match(/\/v\/([A-Za-z0-9_-]{6,})/);if(m)return m[1];
  m=s.match(/\/live\/([A-Za-z0-9_-]{6,})/);if(m)return m[1];
  if(/^[A-Za-z0-9_-]{6,15}$/.test(s))return s;
  return'';
}
function fmtDate(iso){
  if(!iso)return'';
  var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);
}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

var DEMO_PROJECT={
  id:1,name:'Motion Trail Painter',tier:'1',date:'2026-05-14',
  categories:['Canvas','MediaPipe Hands','Animation Tool'],
  desc:'Move your hands and leave glowing colour trails on an infinite canvas.',
  fullDesc:'Motion Trail Painter tracks both hands in real time using MediaPipe and turns fingertip movement into glowing, decaying trails of colour across an infinite canvas.\nAdjust brush size, glow intensity, and decay rate live while you paint with nothing but empty air.\nBuilt as an exploration of gesture as a creative input method — no mouse, no stylus, just motion.',
  thumb:'',
  gallery:[
    {img:'',caption:'Trail decay at low intensity'},
    {img:'',caption:'Two-hand simultaneous painting'},
    {img:'',caption:'High glow / long decay setting'}
  ],
  link:'./motion-trail-painter/',
  resourceLabel:'GitHub Repository',
  resourceLink:'https://github.com',
  youtube:'',
  videoCaption:'MAKING OF',
  videoRuntime:'',
  specSheet:[
    {label:'ENGINE',value:'Canvas 2D API, MediaPipe Hands'},
    {label:'PERFORMANCE',value:'60fps target'}
  ],
  tunableParams:['BRUSH SIZE','GLOW INTENSITY','DECAY RATE']
};

function renderProject(p, projectNumber){
  document.title=(p.name||'Project')+' \u2014 Project Page';

  var numStr=String(projectNumber||1).padStart(3,'0');
  var eyebrowParts=['PROJECT '+numStr];
  if(p.tier)eyebrowParts.push('TIER '+p.tier);
  if(p.categories&&p.categories.length)eyebrowParts.push(p.categories[0].toUpperCase());
  document.getElementById('eyebrowText').textContent=eyebrowParts.join(' / ');

  document.getElementById('titleText').textContent=p.name||'Untitled';
  document.getElementById('subtitleText').textContent=p.desc||'';

  var heroBg=document.getElementById('heroBg');
  if(p.thumb){heroBg.style.backgroundImage="url('"+p.thumb+"')";}

  /* Topics bar - auto-flex, hidden entirely if no categories */
  var topicsBar=document.getElementById('topicsBar');
  var cats=p.categories||[];
  if(!cats.length){
    topicsBar.style.display='none';
  } else {
    topicsBar.style.display='flex';
    var cellsWrap=document.getElementById('topicsCells');
    cellsWrap.innerHTML=cats.map(function(c,i){
      var borderStyle=(i<cats.length-1)?'border-right:1px solid rgba(255,255,255,.10);':'';
      return'<div style="flex:1; padding:20px 24px; '+borderStyle+'">'+esc(c.toUpperCase())+'</div>';
    }).join('');
    var dateCell=document.getElementById('topicsDate');
    if(p.date){dateCell.textContent=fmtDate(p.date);dateCell.style.display='block';}
    else{dateCell.style.display='none';}
  }

  /* Video area - real embed if YouTube link present, else static thumb, else placeholder */
  var videoArea=document.getElementById('videoArea');
  var ytId=ytVideoId(p.youtube);
  if(ytId){
    videoArea.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+ytId+'" title="'+esc(p.name||'')+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0;"></iframe>';
  } else if(p.thumb){
    videoArea.innerHTML='<img src="'+esc(p.thumb)+'" alt="'+esc(p.name||'')+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">';
  } else {
    videoArea.innerHTML='<div class="video-empty" style="position:absolute;inset:0;">No Preview</div>';
  }

  /* Video caption row - hidden if both empty */
  var capRow=document.getElementById('videoCaptionRow');
  if(p.videoCaption||p.videoRuntime){
    capRow.style.display='flex';
    document.getElementById('videoCaptionText').textContent=p.videoCaption||'';
    document.getElementById('videoRuntimeText').textContent=p.videoRuntime||'';
  } else {
    capRow.style.display='none';
  }

  /* Specification panel - hidden if no rows */
  var specPanel=document.getElementById('specPanel');
  var specRows=p.specSheet||[];
  if(!specRows.length){
    specPanel.style.display='none';
  } else {
    specPanel.style.display='flex';
    document.getElementById('specTierBadge').textContent=p.tier?('TIER '+p.tier):'';
    var rowsHTML=specRows.map(function(r){
      return'<div style="padding:16px 0; border-bottom:1px solid rgba(255,255,255,.08); font:400 10px/1 \'IBM Plex Mono\',monospace; letter-spacing:.18em; color:#5D6B7A">'+esc((r.label||'').toUpperCase())+'</div>'
        +'<div style="padding:16px 0; border-bottom:1px solid rgba(255,255,255,.08); color:#E8EDF2">'+esc(r.value||'')+'</div>';
    }).join('');
    document.getElementById('specRows').innerHTML=rowsHTML;

    var tunSection=document.getElementById('tunableParamsSection');
    var tun=p.tunableParams||[];
    if(!tun.length){
      tunSection.style.display='none';
    } else {
      tunSection.style.display='block';
      document.getElementById('tunableParamsChips').innerHTML=tun.map(function(t){
        return'<div style="border:1px solid rgba(255,255,255,.14); padding:9px 11px">'+esc(t.toUpperCase())+'</div>';
      }).join('');
    }
  }

  /* Overview paragraphs - lead paragraph larger, rest standard */
  var text=p.fullDesc||p.desc||'';
  var paras=text.split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var overviewWrap=document.getElementById('overviewParagraphs');
  overviewWrap.innerHTML=paras.map(function(para,i){
    if(i===0)return'<p style="margin:0; font-size:21px; line-height:1.5; color:#E8EDF2">'+esc(para)+'</p>';
    return'<p style="margin:0">'+esc(para)+'</p>';
  }).join('');

  /* Buttons - disabled/greyed if link missing */
  var openBtn=document.getElementById('btnOpenSite');
  if(p.link){openBtn.href=p.link;openBtn.classList.remove('btn-disabled');}
  else{openBtn.removeAttribute('href');openBtn.classList.add('btn-disabled');}

  var resBtn=document.getElementById('btnResources');
  resBtn.innerHTML=esc((p.resourceLabel||'Project Resources').toUpperCase())+' &#8599;';
  if(p.resourceLink){resBtn.href=p.resourceLink;resBtn.classList.remove('btn-disabled');}
  else{resBtn.removeAttribute('href');resBtn.classList.add('btn-disabled');}

  /* Gallery - only populated items, uniform reflowing grid, hidden entirely if empty */
  var galleryWrap=document.getElementById('galleryWrap');
  var items=(p.gallery||[]).filter(function(g){return g&&g.img;});
  if(!items.length){
    galleryWrap.style.display='none';
  } else {
    galleryWrap.style.display='block';
    document.getElementById('galleryCount').textContent=items.length+' ITEM'+(items.length!==1?'S':'');
    var grid=document.getElementById('galleryGrid');
    grid.innerHTML=items.map(function(g,i){
      var num=String(i+1).padStart(2,'0');
      var label=g.caption?(num+' / '+g.caption.toUpperCase()):(num+' / ITEM');
      var bigSpan=(i%6===0)?'grid-column:span 2; grid-row:span 2; ':'';
      return'<div class="gal hv1" data-index="'+i+'" data-src="'+esc(g.img)+'" data-label="'+esc(label)+'" style="cursor:zoom-in; min-width:0; '+bigSpan+'border:1px solid rgba(255,255,255,.09); background-image:url(&quot;'+esc(g.img)+'&quot;); background-size:cover; background-position:center; display:flex; align-items:flex-end; padding:14px; font:600 10px/1 \'IBM Plex Mono\',monospace; letter-spacing:.16em; color:#E8EDF2; text-shadow:0 1px 6px rgba(0,0,0,.6)">'+esc(label)+'</div>';
    }).join('');
    initLightbox(p.name||'Project');
  }

  document.getElementById('page').style.visibility='visible';
  document.getElementById('loadingNote').classList.add('hidden');
}

function initLightbox(projectName){
  var tiles=[].slice.call(document.querySelectorAll('.gal'));
  var lb=document.getElementById('lb');
  var img=document.getElementById('lb-img');
  var label=document.getElementById('lb-label');
  document.getElementById('lbTitle').textContent=projectName;
  var i=0;

  function show(n){
    i=(n+tiles.length)%tiles.length;
    var t=tiles[i];
    var src=t.getAttribute('data-src');
    img.style.backgroundImage=src?"url('"+src+"')":'repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px)';
    label.textContent=t.getAttribute('data-label')||'';
  }
  function openLB(n){show(n);lb.classList.add('open');lb.setAttribute('aria-hidden','false');}
  function closeLB(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');}

  tiles.forEach(function(t,n){t.addEventListener('click',function(){openLB(n);});});
  lb.addEventListener('click',function(e){if(e.target===lb)closeLB();});
  document.querySelector('.lb-x').addEventListener('click',closeLB);
  document.getElementById('lb-prev').addEventListener('click',function(){show(i-1);});
  document.getElementById('lb-next').addEventListener('click',function(){show(i+1);});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')closeLB();
    if(e.key==='ArrowRight')show(i+1);
    if(e.key==='ArrowLeft')show(i-1);
  });
}

function loadData(){
  var params=new URLSearchParams(location.search);
  var wantId=params.get('id');

  fetch('Sandbox_Projects.json')
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(d){
      var list=d.projects||[];
      var p=null,idx=-1;
      if(wantId){
        for(var i=0;i<list.length;i++){if(String(list[i].id)===wantId){p=list[i];idx=i;break;}}
      }
      if(!p&&list.length){p=list[0];idx=0;}
      if(!p)throw 0;
      renderProject(p,idx+1);
    })
    .catch(function(){
      renderProject(DEMO_PROJECT,1);
    });
}
loadData();
</script>
