<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;display:block;background:#0b111b}</style></head><body><canvas id="canvas"></canvas><script type="module">
import {initial,step,cameraRotation} from './flight.js';
const send=(type,extra={})=>parent.postMessage({type,...extra},location.origin);
let app,asset,active=false,state,scene,camera,pc,input={speed:0,yaw:0,altitude:0};
function stop(){active=false;input={speed:0,yaw:0,altitude:0};if(state){state.speed=state.climb=state.turn=state.bank=0;}}
function dispose(){stop();if(app){const device=app.graphicsDevice;app.destroy();device.gl?.getExtension('WEBGL_lose_context')?.loseContext();app=null;}}
addEventListener('pagehide',dispose);
addEventListener('message',async e=>{if(e.source!==parent||e.origin!==location.origin)return;const m=e.data;
try{
if(m.type==='load'){
 scene=m.scene;state=initial(scene);
 pc=await import('https://cdn.jsdelivr.net/npm/playcanvas@2.12.1/+esm');
 app=new pc.Application(document.querySelector('canvas'),{graphicsDeviceOptions:{antialias:false,alpha:false,preserveDrawingBuffer:false}});
 app.graphicsDevice.maxPixelRatio=1;
 app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);
 camera=new pc.Entity('Camera');camera.addComponent('camera',{clearColor:new pc.Color(.035,.043,.065),fov:65,nearClip:.01,farClip:1000});app.root.addChild(camera);
 asset=new pc.Asset('Scene','gsplat',{url:m.url,filename:'scene.sog'});app.assets.add(asset);
 await new Promise((resolve,reject)=>{asset.once('load',resolve);asset.once('error',reject);app.assets.load(asset);});
 const splat=new pc.Entity('SOG');splat.addComponent('gsplat',{asset});splat.setEulerAngles(...(scene.rotation||[180,0,0]));app.root.addChild(splat);
 const update=dt=>{if(active)step(state,input,dt,scene);camera.setPosition(...state.position);camera.setRotation(...cameraRotation(state));};update(0);app.on('update',update);
 app.once('frameend',()=>send('ready'));app.start();
}else if(m.type==='getPose'&&state){const round=n=>Number(n.toFixed(4));send('pose',{pose:{position:state.position.map(round),yaw:round(state.yaw),pitch:round(state.pitch)}});}else if(m.type==='input'){input=m.input;}else if(m.type==='active'){stop();active=m.active;}else if(m.type==='reset'){stop();state=initial(scene);}else if(m.type==='dispose'){dispose();}
}catch(error){send('error',{message:String(error.message||error)});}});
addEventListener('resize',()=>app?.resizeCanvas());send('boot');
</script></body></html>
